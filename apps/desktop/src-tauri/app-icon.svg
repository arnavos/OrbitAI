<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Outer Orbit Ring -->
  <ellipse cx="256" cy="256" rx="170" ry="80" fill="none" stroke="url(#orbitGrad)" stroke-width="14" transform="rotate(-30 256 256)" filter="url(#glow)" />
  
  <!-- Center Core Planet/Hexagon -->
  <circle cx="256" cy="256" r="64" fill="url(#orbitGrad)" />
  <circle cx="256" cy="256" r="48" fill="#0f172a" />
  <polygon points="256,220 287,238 287,274 256,292 225,274 225,238" fill="url(#orbitGrad)" />
  
  <!-- Satellite Orbit Node -->
  <circle cx="390" cy="180" r="14" fill="#38bdf8" filter="url(#glow)" />
</svg>
