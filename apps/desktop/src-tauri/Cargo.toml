[package]
name = "orbit-desktop"
version = "0.1.0"
description = "ORBIT Desktop Application Host"
authors = ["ORBIT Team"]
edition = "2021"

[lib]
name = "orbit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["process", "sync", "rt", "time", "net", "io-util", "macros"] }
uuid = { version = "1.8", features = ["v4"] }
libc = "0.2"
